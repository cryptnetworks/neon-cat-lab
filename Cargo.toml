[package]
name = "neon-cat-lab"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "neon-cat-lab"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "x11"] }
global-hotkey = "0.8"
serde_json = "1"
winit = { version = "0.30", default-features = false }

[build-dependencies]
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
